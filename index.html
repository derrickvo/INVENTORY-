<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="dashboard-layout">

    <div class="stats-panel">
        <h2>Overview</h2>

        <div class="stat-card">
            <span>Total Items</span>
            <strong id="totalItems">0</strong>
        </div>

        <div class="stat-card">
            <span>Listed</span>
            <strong id="listedCount">0</strong>
        </div>

        <div class="stat-card">
            <span>Unlisted</span>
            <strong id="unlistedCount">0</strong>
        </div>
        
        <div class="stat-card">
            <span>Total Spent</span>
            <strong id="totalSpent">$0</strong>
        </div>
        <div class="stat-card">
            <span>TOTAL SALES</span>
            <strong id="totalSales">$0</strong>
        </div>
         <div class="stat-card">
            <span>TOTAL PROFITS</span>
            <strong id="totalPROFITS">$0</strong>
        </div>
         
    </div>
    <div class="container">

        <h1>Depop Inventory</h1>

        <div class="form-card">
            <Label>PICTURE</Label>
            <input type="file" id="image" accept="image/*">
            <label>Item Name</label>
            <input id="itemName">

            <label>Brand</label>
            <input id="brand">

            <label>Size</label>
            <input id="size">

            <label>Buy Price</label>
            <input id="buyPrice" type="number">

            <label>Listing Price</label>
            <input id="listingPrice" type="number">

            <label>DESCRIPTION</label>
            <input id="DESCRIPTION">

            <label>Status</label>
            <select id="status">
                <option value="Unlisted">Unlisted</option>
                <option value="Listed">Listed</option>
                <option value="Sold">Sold</option>
                <option value="Shipped">Shipped</option>
            </select>

            <button id="ADD">Add Item</button>

        </div>



<a href="inventory.html" class="inventory-button">View Inventory</a>

    <script src="script.js"></script>

</body>
</html>
